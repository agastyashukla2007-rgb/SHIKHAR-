name: Build & Release Android Debug APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0-debug'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies & verify TypeScript
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install Capacitor & initialize Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "SankalpPrep" "com.sankalpprep.app" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact & SHA-256 checksum
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/SankalpPrep-debug.apk
          sha256sum release-assets/SankalpPrep-debug.apk > release-assets/SankalpPrep-debug.apk.sha256

      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SankalpPrep-debug-apk
          path: release-assets/*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: SankalpPrep Android APK (${{ github.event.inputs.release_tag || github.ref_name }})
          generate_release_notes: true
          files: |
            release-assets/SankalpPrep-debug.apk
            release-assets/SankalpPrep-debug.apk.sha256
